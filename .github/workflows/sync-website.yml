name: Sync Blog to Website

on:
  push:
    branches: [main]
    paths:
      - "posts/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website blog sync
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.WEBSITE_URL }}/api/webhooks/blog" \
            -H "Authorization: Bearer ${{ secrets.BLOG_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" 2>&1) || true

          body=$(echo "$response" | head -1)
          http_code=$(echo "$response" | tail -1)

          echo "Response: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Webhook failed with status $http_code"
            exit 1
          fi
