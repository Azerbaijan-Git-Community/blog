name: Validate Blog Post

on:
  pull_request:
    branches: [main]
    paths:
      - "posts/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check
        env:
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          BLOG_VALIDATE_SECRET: ${{ secrets.AUTHOR_VALIDATE_SECRET }}
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
